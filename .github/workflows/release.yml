# A tag like v1.0 builds one zip per version and publishes them as a GitHub release.
# If a tag push doesn't start it, run it from the Actions tab and pick the tag under "Use workflow from".
name: Release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  release:
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: One zip per version, the page renamed to index.html
        run: |
          pack() { # pack <zip name> <page> <files it needs>
            name=$1 page=$2; shift 2
            mkdir -p "build/$name"
            cp "$page" "build/$name/index.html"
            cp favicon.svg "$@" "build/$name/"
            (cd build && zip -qr "$name.zip" "$name")
          }
          pack startpage              index.html              style.css
          pack startpage-search       index_search.html       style.css sections.js search.js
          pack startpage-tasks        index_tasks.html        style.css tasks.css sections.js tasks.js
          pack startpage-search-tasks index_search_tasks.html style.css tasks.css sections.js search.js tasks.js
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > notes.md <<EOF
          Pick one zip, unzip it and open \`index.html\`:

          - **startpage.zip**: bookmarks, no JavaScript
          - **startpage-search.zip**: bookmarks and search
          - **startpage-tasks.zip**: bookmarks and the tasks panel
          - **startpage-search-tasks.zip**: bookmarks, search and the tasks panel

          Pick your colors on the [color page](https://${GITHUB_REPOSITORY_OWNER}.github.io/${GITHUB_REPOSITORY#*/}/docs/).
          The "Source code" downloads below are the whole repo, added by GitHub to every release.
          EOF
          gh release create "$GITHUB_REF_NAME" build/*.zip --title "Start page ${GITHUB_REF_NAME#v}" --notes-file notes.md
