# A tag like v1.0 builds one zip per version and publishes them as a GitHub release
name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: One zip per version, the page renamed to index.html
        run: |
          pack() { # pack <zip name> <page> <files it needs>
            name=$1 page=$2; shift 2
            mkdir -p "build/$name"
            cp "$page" "build/$name/index.html"
            cp favicon.svg "$@" "build/$name/"
            (cd build && zip -qr "$name.zip" "$name")
          }
          pack startpage              index.html              style.css
          pack startpage-search       index_search.html       style.css sections.js search.js
          pack startpage-tasks        index_tasks.html        style.css tasks.css sections.js tasks.js
          pack startpage-search-tasks index_search_tasks.html style.css tasks.css sections.js search.js tasks.js
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" build/*.zip --title "$GITHUB_REF_NAME" --generate-notes
